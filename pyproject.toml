[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asvspoof-explainable-detection"
version = "0.1.0"
description = "Explainable multi-feature replay-attack detection on ASVspoof 2019 PA"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "soundfile>=0.12",
  "PyYAML>=6.0",
  "tqdm>=4.65",
  "av>=17.1.0",
  "scipy>=1.10",
  "threadpoolctl>=3.1",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
explain = ["shap>=0.45", "matplotlib>=3.7"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
